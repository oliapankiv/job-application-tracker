<div class="home-page">
  <mat-card class="home-card">
    <mat-card-header>
      <mat-card-title>You're signed in</mat-card-title>
      <mat-card-subtitle>{{ currentUser()?.displayName || currentUser()?.email }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ currentUser()?.email }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="logout()">Sign out</button>
    </mat-card-actions>
  </mat-card>
</div>
